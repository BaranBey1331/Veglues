name: Build Android APK

on:
  push:
    branches: [ "main", "master", "optimization/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with Gradle (detailed output)
      run: |
        # Generate wrapper if missing or just run gradle
        gradle wrapper
        ./gradlew assembleDebug --stacktrace --warning-mode all

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/outputs/apk/debug/app-debug.apk
